name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build add-on zip
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: network-plus-zip
          path: dist/*.zip
          if-no-files-found: error

  lint:
    name: Mozilla add-on lint
    runs-on: ubuntu-latest
    # Advisory: addons-linter rules change over time; review warnings in the job log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: web-ext lint
        run: npx --yes web-ext@8 lint --source-dir . --ignore-files "test/**" "docs/**" "scripts/**" "dist/**" "package.json" "*.md"
